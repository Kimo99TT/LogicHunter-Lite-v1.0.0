# Copy to config.yaml. Only list targets you own or are explicitly authorized to test.
# Wildcards are explicit: *.example.com includes subdomains but not example.com itself.
allowed_hosts:
  - localhost
  - 127.0.0.1
  - localhost:9999
  - 127.0.0.1:9999

import:
  ignore_static: true
  max_body_preview: 3000
  max_response_preview: 5000
  # Imported Burp requests can be labelled per export with --role attacker|victim|unknown.
  # Export each test account separately for reliable role attribution.

test_loop:
  max_iterations: 3
  max_requests_per_run: 30
